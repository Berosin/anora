services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:

# Usage:
#   docker compose up -d
#   Then set QDRANT_URL=http://localhost:6333 in ai-service/.env
#
# Without this running, ai-service falls back to an embedded local Qdrant
# instance automatically (see ai-service/app/vectorstore/qdrant_client.py)
# — so this is a convenience for closer-to-production local dev, not a
# hard requirement to get the project running.
